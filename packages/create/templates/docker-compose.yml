x-answer-engine-image: &answer-engine-image "${ANSWER_ENGINE_IMAGE:-ghcr.io/the-answerai/answer-engine:1.1.0}"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT_HOST}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: *answer-engine-image
    pull_policy: missing
    command: ["node", "dist/scripts/migrate.js"]
    env_file: [.env.compose]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  init:
    image: *answer-engine-image
    pull_policy: missing
    command: ["node", "dist/scripts/init.js"]
    env_file: [.env.compose]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: *answer-engine-image
    pull_policy: missing
    command: ["node", "dist/server.js"]
    env_file: [.env.compose]
    ports:
      - "127.0.0.1:${ANSWER_ENGINE_PORT}:5000"
    volumes:
      - answerengine_blobs:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
    name: {{POSTGRES_VOLUME}}
  redis_data:
    name: {{REDIS_VOLUME}}
  answerengine_blobs:
    name: {{BLOBS_VOLUME}}
