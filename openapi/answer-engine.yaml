openapi: 3.1.0
info:
  title: Answer Engine OSS API
  version: 1.1.0
  summary: Local-first memory, retrieval, and grounded answers for AI agents.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:5050
    description: Default local server
security:
  - apiKey: []
  - bearerKey: []
tags:
  - name: System
  - name: Content
  - name: Memory
  - name: Organization
  - name: Workflows
  - name: Operations
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Check local API health
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime]
                properties:
                  status: { type: string, const: healthy }
                  uptime: { type: number }
  /api/v1/content/import/preview:
    post:
      tags: [Content]
      summary: Validate an import without writing it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/content/import:
    post:
      tags: [Content]
      summary: Import or update local content
      description: Reusing a source identifier updates the matching item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/content:
    get:
      tags: [Content]
      summary: List recent content
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: libraryId, schema: { type: string } }
        - { in: query, name: librarySlug, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/content/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContentId' }
    get:
      tags: [Content]
      summary: Get a content item
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Content]
      summary: Soft-delete a content item
      responses:
        '204': { description: Content deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/{id}/lineage:
    parameters:
      - { $ref: '#/components/parameters/ContentId' }
    get:
      tags: [Content]
      summary: Inspect source provenance and artifact history
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent/schema:
    get:
      tags: [Memory]
      summary: Discover available content and capabilities
      parameters:
        - { in: query, name: libraryId, schema: { type: string } }
        - { in: query, name: librarySlug, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/query:
    post:
      tags: [Memory]
      summary: Search local memory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/retrieve:
    post:
      tags: [Memory]
      summary: Retrieve known items or a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetrieveRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/summarize:
    post:
      tags: [Memory]
      summary: Summarize local evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SummarizeRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/ask:
    post:
      tags: [Memory]
      summary: Answer from local evidence with citations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/tags:
    get:
      tags: [Organization]
      summary: List active tags
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Organization]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tags/{tagId}:
    parameters:
      - { $ref: '#/components/parameters/TagId' }
    patch:
      tags: [Organization]
      summary: Update a tag
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organization]
      summary: Archive a tag
      responses:
        '204': { description: Tag archived. }
  /api/v1/tags/{tagId}/content:
    parameters:
      - { $ref: '#/components/parameters/TagId' }
    post:
      tags: [Organization]
      summary: Assign a tag to content in bulk
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Organization]
      summary: Remove a tag from content in bulk
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries:
    get:
      tags: [Organization]
      summary: List libraries with effective member counts
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Organization]
      summary: Create a saved content library
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/libraries/{libraryId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      tags: [Organization]
      summary: Get a library
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organization]
      summary: Update a user-defined library
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { description: A system-library invariant was violated. }
    delete:
      tags: [Organization]
      summary: Archive a user-defined library
      responses:
        '204': { description: Library archived. }
        '409': { description: The system library cannot be archived. }
  /api/v1/libraries/{libraryId}/members:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      tags: [Organization]
      summary: Page through effective library membership
      description: Membership is `(saved filter OR manual include) AND NOT manual exclude`.
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/preview:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    post:
      tags: [Organization]
      summary: Preview a strict saved filter without changing the library
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/libraries/{libraryId}/includes/{contentId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/MemberContentId' }
    put:
      tags: [Organization]
      summary: Add a manual library include
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Organization]
      summary: Remove a manual library include
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/excludes/{contentId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/MemberContentId' }
    put:
      tags: [Organization]
      summary: Add a manual library exclusion
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Organization]
      summary: Remove a manual library exclusion
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/recipes:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      tags: [Workflows]
      summary: List library recipes
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Workflows]
      summary: Create a versioned library recipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/recipes/{recipeId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/RecipeId' }
    patch:
      tags: [Workflows]
      summary: Save a new immutable recipe version
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Workflows]
      summary: Deactivate a recipe
      responses:
        '204': { description: Recipe deactivated. }
  /api/v1/libraries/{libraryId}/recipes/{recipeId}/preview:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/RecipeId' }
    post:
      tags: [Workflows]
      summary: Preview recipe outputs over effective members
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/recipes/{recipeId}/runs:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/RecipeId' }
    get:
      tags: [Workflows]
      summary: List durable recipe runs
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Workflows]
      summary: Queue a recipe run
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/runs/{runId}:
    get:
      tags: [Workflows]
      summary: Get recipe-run progress and per-item results
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/runs/{runId}/cancel:
    post:
      tags: [Workflows]
      summary: Safely cancel queued or running recipe work
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/runs/{runId}/retry:
    post:
      tags: [Workflows]
      summary: Retry failed, partial, or canceled recipe work
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/content/{id}/artifacts:
    get:
      tags: [Workflows]
      summary: List artifact versions and lineage for content
      parameters:
        - { $ref: '#/components/parameters/ContentId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [Workflows]
      summary: Get an artifact version
      parameters:
        - { $ref: '#/components/parameters/ArtifactId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/reports:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      tags: [Workflows]
      summary: List library report definitions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Workflows]
      summary: Create a library report definition
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/reports/{reportId}/generate:
    post:
      tags: [Workflows]
      summary: Queue a grounded report generation
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/reports/{reportId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/ReportId' }
    patch:
      tags: [Workflows]
      summary: Update a report definition
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Workflows]
      summary: Delete a report definition and generated history
      responses:
        '204': { description: Report deleted. }
  /api/v1/libraries/{libraryId}/reports/{reportId}/generated:
    get:
      tags: [Workflows]
      summary: List generated report history
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/ReportId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/reports/{reportId}/generated/{generatedId}/cancel:
    post:
      tags: [Workflows]
      summary: Safely cancel queued or running report work
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/ReportId' }
        - { $ref: '#/components/parameters/GeneratedId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/reports/{reportId}/generated/{generatedId}/retry:
    post:
      tags: [Workflows]
      summary: Retry failed or canceled report work
      parameters:
        - { $ref: '#/components/parameters/LibraryId' }
        - { $ref: '#/components/parameters/ReportId' }
        - { $ref: '#/components/parameters/GeneratedId' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/dashboards:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
    get:
      tags: [Workflows]
      summary: List library dashboards
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Workflows]
      summary: Create a library dashboard
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/libraries/{libraryId}/dashboards/{dashboardId}:
    parameters:
      - { $ref: '#/components/parameters/LibraryId' }
      - { $ref: '#/components/parameters/DashboardId' }
    patch:
      tags: [Workflows]
      summary: Update a library dashboard
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Workflows]
      summary: Delete a library dashboard
      responses:
        '204': { description: Dashboard deleted. }
  /api/v1/batch-jobs:
    get:
      tags: [Operations]
      summary: List local batch jobs
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Operations]
      summary: Queue a provider-neutral local batch job
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/batch-jobs/{jobId}:
    get:
      tags: [Operations]
      summary: Get batch progress and per-item results
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/batch-jobs/{jobId}/cancel:
    post:
      tags: [Operations]
      summary: Safely cancel queued or running batch work
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/batch-jobs/{jobId}/retry:
    post:
      tags: [Operations]
      summary: Retry failed, partial, or canceled batch work
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /api/v1/access-tokens:
    get:
      tags: [Operations]
      summary: List access-token metadata without secrets
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Operations]
      summary: Mint a tenant- or library-scoped access token
      description: The raw `ae_live_` token is returned only by this operation.
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/access-tokens/{tokenId}:
    patch:
      tags: [Operations]
      summary: Update access-token metadata or expiry
      parameters:
        - { $ref: '#/components/parameters/TokenId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Operations]
      summary: Revoke an access token
      parameters:
        - { $ref: '#/components/parameters/TokenId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/audit:
    get:
      tags: [Operations]
      summary: Page through local tenant or library audit history
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/content/{id}/blobs:
    parameters:
      - { $ref: '#/components/parameters/ContentId' }
    get:
      tags: [Content]
      summary: List local blob metadata for content
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Content]
      summary: Store a content blob beneath AE_HOME
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/blobs/{blobId}/download:
    get:
      tags: [Content]
      summary: Download a tenant-scoped local blob
      parameters:
        - { $ref: '#/components/parameters/BlobId' }
      responses:
        '200': { description: Blob bytes. }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerKey:
      type: http
      scheme: bearer
  parameters:
    ContentId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    MemberContentId:
      in: path
      name: contentId
      required: true
      schema: { type: string, format: uuid }
    LibraryId:
      in: path
      name: libraryId
      required: true
      schema: { type: string, format: uuid }
    TagId:
      in: path
      name: tagId
      required: true
      schema: { type: string, format: uuid }
    RecipeId:
      in: path
      name: recipeId
      required: true
      schema: { type: string, format: uuid }
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      in: path
      name: artifactId
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      in: path
      name: reportId
      required: true
      schema: { type: string, format: uuid }
    GeneratedId:
      in: path
      name: generatedId
      required: true
      schema: { type: string, format: uuid }
    DashboardId:
      in: path
      name: dashboardId
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      in: path
      name: tokenId
      required: true
      schema: { type: string, format: uuid }
    BlobId:
      in: path
      name: blobId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Success:
      description: Request completed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: A valid local API key is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The requested content was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    TagInput:
      type: object
      additionalProperties: false
      required: [slug, label]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        label: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        category: { type: [string, 'null'], maxLength: 120 }
        parentId: { type: [string, 'null'], format: uuid }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        metadata: { type: object, additionalProperties: true }
    LibraryFilter:
      type: object
      additionalProperties: false
      required: [conditions]
      properties:
        operator: { enum: [and, or], default: and }
        conditions:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field:
                type: string
                description: content_type, source, created_at, tag, metadata.<key>, or analysis.<key>.
              operator: { enum: [eq, in, contains, gte, lte] }
              value:
                oneOf:
                  - { type: [string, number, boolean] }
                  - { type: array, minItems: 1, maxItems: 100, items: { type: [string, number, boolean] } }
    LibraryInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: [string, 'null'], maxLength: 2000 }
        filter:
          oneOf:
            - { $ref: '#/components/schemas/LibraryFilter' }
            - { type: 'null' }
        metadata: { type: object, additionalProperties: true }
    RecipeInput:
      type: object
      additionalProperties: false
      required: [name, contentTypes, systemPrompt, userPromptTemplate, outputType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        contentTypes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ContentType' }
        systemPrompt: { type: string, minLength: 1, maxLength: 20000 }
        userPromptTemplate: { type: string, minLength: 1, maxLength: 20000 }
        outputType: { type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$' }
        outputSchema: { type: [object, 'null'], additionalProperties: true }
        modelId: { type: [string, 'null'] }
        maxTokens: { type: [integer, 'null'], minimum: 1, maximum: 32000 }
        isActive: { type: boolean, default: true }
    ImportRequest:
      type: object
      required: [items]
      properties:
        libraryId: { type: string }
        librarySlug: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [title]
            properties:
              title: { type: string, maxLength: 500 }
              content: { type: string, maxLength: 5242880 }
              contentType: { $ref: '#/components/schemas/ContentType' }
              sourceIdentifier: { type: string, maxLength: 512 }
              source: { type: string, maxLength: 120 }
              sourceData: { type: object, additionalProperties: true }
              metadata: { type: object, additionalProperties: true }
              rawArchiveManifest: { type: object, additionalProperties: true }
              sourceAgentId: { type: string }
              conversationId: { type: string }
              turnIndex: { type: integer, minimum: 0 }
              turnRole:
                enum: [user, assistant, system, tool, developer, other]
              turnTimestamp: { type: string, format: date-time }
    QueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        searchType: { enum: [fulltext, semantic, hybrid], default: hybrid }
        libraryId: { type: string }
        librarySlug: { type: string }
        conversationId: { type: string }
        sourceAgentId: { type: string }
        include:
          type: array
          items: { enum: [summary, content, tags, metadata, artifacts, artifactBodies] }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
        filters:
          type: object
          properties:
            contentTypes:
              type: array
              items: { $ref: '#/components/schemas/ContentType' }
            tags: { type: array, items: { type: string } }
            dateFrom: { type: string, format: date-time }
            dateTo: { type: string, format: date-time }
            status: { enum: [active, archived] }
    RetrieveRequest:
      type: object
      description: Supply ids or conversationId.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        conversationId: { type: string }
        sourceAgentId: { type: string }
        libraryId: { type: string }
        librarySlug: { type: string }
        include: { type: array, items: { type: string } }
    SummarizeRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        libraryId: { type: string }
        librarySlug: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 4000 }
        contentIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        libraryId: { type: string }
        librarySlug: { type: string }
        conversationId: { type: string }
        sourceAgentId: { type: string }
        retrievalMode: { enum: [fulltext, semantic, hybrid], default: hybrid }
        responseStyle: { enum: [cited, conversational], default: cited }
    ContentType:
      enum: [call, document, ticket, domain, chat, page]
